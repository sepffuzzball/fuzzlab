---
apiVersion: batch/v1
kind: Job
metadata:
  name: synapse-database-v1
  namespace: database
  labels:
    app.kubernetes.io/name: synapse-database-v1
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse-database-v1
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-synapse-database
          image: docker.io/library/postgres:16.5
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: postgres-pguser-postgres
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: postgres-pguser-postgres
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-pguser-postgres
                  key: user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-pguser-postgres
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              set -eu

              DB="synapse"
              OWNER="synapse"

              echo "Waiting for PostgreSQL ($PGHOST:$PGPORT) to become reachable..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                echo "PostgreSQL not ready; retrying in 5s..."
                sleep 5
              done
              echo "PostgreSQL is reachable."

              echo "Waiting for role '$OWNER' to be created by the PostgresCluster..."
              until [ "$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$OWNER'")" = "1" ]; do
                echo "Role '$OWNER' not present yet; retrying in 5s..."
                sleep 5
              done
              echo "Role '$OWNER' exists."

              DB_EXISTS=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$DB'")

              if [ "$DB_EXISTS" = "1" ]; then
                echo "Database '$DB' already exists; verifying locale and owner."
                LC_COLLATE_C=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc "SELECT datcollate FROM pg_database WHERE datname = '$DB'")
                LC_CTYPE_C=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -tAc "SELECT datctype FROM pg_database WHERE datname = '$DB'")
                if [ "$LC_COLLATE_C" != "C" ] || [ "$LC_CTYPE_C" != "C" ]; then
                  echo "FAIL: database '$DB' exists but locales are not C (collate='$LC_COLLATE_C', ctype='$LC_CTYPE_C')" >&2
                  exit 1
                fi
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -v ON_ERROR_STOP=1 \
                  -c "ALTER DATABASE \"$DB\" OWNER TO \"$OWNER\";"
                echo "Database '$DB' already present with C locales; owner enforced to '$OWNER'."
              else
                echo "Creating database '$DB' owned by '$OWNER'."
                psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -v ON_ERROR_STOP=1 \
                  -c "CREATE DATABASE \"$DB\" OWNER \"$OWNER\" TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C';"
                echo "Database '$DB' created."
              fi
              echo "Done."
