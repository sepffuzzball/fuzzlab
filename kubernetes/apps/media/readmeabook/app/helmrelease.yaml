---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: &app readmeabook
  namespace: media
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: csi-driver-cephfs
      namespace: storage
    - name: csi-driver-smb
      namespace: storage
  values:
    controllers:
      arr:
        pod:
          securityContext:
            runAsUser: ${PUID}
            runAsGroup: ${PGID}
            runAsNonRoot: true
            fsGroup: ${PGID}
            fsGroupChangePolicy: OnRootMismatch

        containers:
          main:
            image:
              repository: ghcr.io/kikootwo/readmeabook
              tag: 1.3.0
            env:
              #PUID: ${PUID}
              #PGID: ${PGID}
              UMASK: 002
              DISABLE_LOCAL_LOGIN: true
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: ${DB_USER}-db-secret
                    key: DATABASE_URL
            resources:
              requests:
                cpu: 18m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      main:
        controller: arr
        ports:
          http:
            port: 3030

    persistence:
      config:
        enabled: true
        existingClaim: readmeabook-config
        globalMounts:
          - path: /app/config
      cache:
        enabled: true
        existingClaim: readmeabook-cache
        globalMounts:
          - path: /app/cache
      redis:
        enabled: true
        existingClaim: readmeabook-redis
        globalMounts:
          - path: /var/lib/redis
      tmp:
        type: emptyDir
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      lcl:
        enabled: true
        existingClaim: lcl
        globalMounts:
          - path: /media
      downloads:
        enabled: true
        existingClaim: lcl-downloads
        globalMounts:
          - path: /downloads
