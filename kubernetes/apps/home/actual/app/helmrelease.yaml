---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app actual
  namespace: home
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: csi-driver-cephfs
      namespace: storage
  values:
    controllers:
      actual:
        annotations:
          reloader.stakater.com/auto: 'true'

        containers:
          app:
            image:
              repository: ghcr.io/actualbudget/actual
              tag: 26.8.1
              pullPolicy: IfNotPresent

            env:
              TZ: "${TIMEZONE}"
              ACTUAL_PORT: &port 5006
              ACTUAL_DATA_DIR: /data
              ACTUAL_OPENID_AUTH_METHOD: openid
              ACTUAL_USER_CREATION_MODE: login
              ACTUAL_OPENID_ENFORCE: "true"
            envFrom:
              - secretRef:
                  name: actual-secrets

            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 1
                  failureThreshold: 30

    service:
      app:
        controller: actual
        ports:
          http:
            port: *port
    route:
      app:
        enabled: true
        hostnames:
          - budget.${SECRET_DOMAIN}
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        existingClaim: actual-data
        globalMounts:
          - path: /data
