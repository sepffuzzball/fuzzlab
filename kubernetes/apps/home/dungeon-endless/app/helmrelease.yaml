---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dungeon-endless
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      dungeon-endless:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        pod:
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
        containers:
          app:
            image:
              repository: ghcr.io/sepffuzzball/dungeon-endless
              tag: sha-2d8e523
            env:
              NODE_ENV: production
              PORT: "3000"
              ORIGIN: https://dungeon.${SECRET_DOMAIN_FBE}
              SECURE_COOKIE: "true"
              LLM_MAX_RESPONSE_BYTES: 262144
            envFrom:
              - secretRef:
                  name: dungeon-endless-db-secret
              - secretRef:
                  name: dungeon-endless-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  tcpSocket:
                    port: &port 3000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                    scheme: HTTP
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                custom: true
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                    scheme: HTTP
                  failureThreshold: 60
                  periodSeconds: 5
                  timeoutSeconds: 5
    service:
      app:
        controller: dungeon-endless
        ports:
          http:
            port: *port
